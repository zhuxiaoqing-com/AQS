<!DOCTYPE html>

<html lang="en">
<head>
    <meta charSet="UTF-8">
    <title>vuejs简单示例</title>
</head>
<body>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/2.7.4/vue.js"></script>
<div id="app">
    <p>{{ message }}</p>
</div>
<script>
    new Vue({
        el: '#app',
        data: {
            message: '欢迎学习Vue.js!'
        }
    })
</script>
</body>
</html>
