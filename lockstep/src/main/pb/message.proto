// 如果需要将小协议整合起来发送 可以弄个 MsgGroup的通用功能; 但是这样的话客户端监听可能会触发很多遍，所以最好还是包装一层;
// 客户端解析应该可以用字典树来进行根节点触发事件;

// ------------------- 主体 -------------------

message MsgDeltaField {
  int32 msgId = 1;                      // 对象类型ID
  repeated DeltaField delta = 2; // 对应字段路径
}

message DeltaField {
  repeated PBFieldPath fieldPath = 1; // 对应字段路径
  PBFieldModify modify = 2;  // 该路径下所有操作
}

// ------------------- 每个路径下的操作实体 -------------------
message PBFieldModify {
  enum ModifyType {
    FIELD = 0;     // 普通字段
    LIST = 1;      // 列表操作
    MAP = 2;       // Map操作
  }
  ModifyType type = 1;
  PBFieldValue value = 2;                 // FIELD 类型时有效
  repeated PBListOperation listOps = 3;   // LIST 类型时有效
  repeated PBMapOperation mapOps = 4;     // MAP 类型时有效
}

// ------------------- List 操作 -------------------
message PBListOperation {
  enum ListOpType {
    ADD = 0;
    REMOVE = 1;
    SET = 2;
    CLEAR = 3;
  }

  ListOpType op = 1;
  int32 index = 2;                    // 对应位置（ADD/REMOVE/SET 用）
  PBFieldValue value = 3;             // ADD/SET 用
}

// ------------------- Map 操作 -------------------
message PBMapOperation {
  enum MapOpType {
    PUT = 0;
    REMOVE = 1;
    CLEAR = 2;
  }

  MapOpType op = 1;
  PBFieldValue key = 2;
  PBFieldValue value = 3;
}

// ------------------- 基础字段类型 -------------------
message PBFieldValue {
  enum PBFieldType {
    PB_INT32 = 0;
    PB_INT64 = 1;
    PB_FLOAT = 2;
    PB_DOUBLE = 3;
    PB_STRING = 4;
    PB_BYTES = 5;
    PB_BOOL = 6;
    PB_MESSAGE = 7;
  }

  PBFieldType type = 1;
  int32 int32Value = 2;
  int64 int64Value = 3;
  float floatValue = 4;
  double doubleValue = 5;
  string stringValue = 6;
  bool boolValue = 7;
  bytes bytesValue = 8;  // PB_MESSAGE 类型用
}

// ------------------- 字段路径 -------------------
message PBFieldPath {
  optional int32 fieldIndex = 1;
  repeated int32 listIndex = 2; // 如果嵌套 list
  repeated string mapKey = 3;   // 如果嵌套 map
  optional FieldType type = 4;  // 可选，LIST/MAP/FIELD
  enum FieldType {
    FIELD = 0;
    LIST = 1;
    MAP = 2;
  }
}

message PBTestMapValue2{
  int32 a1 = 1;
  int32 a2 = 2;
}

message PBTestMapValue{
  PBTestMapValue2 v = 1;
  int32 a2 = 2;
}
message PBTest1 {
  map<int32, PBTestMapValue> mapInt32Obj = 1;
  map<string, PBTestMapValue> mapStrObj = 2;
  map<int64, PBTestMapValue> mapInt64Obj = 3;
  map<int32, int32> mapInt32Int = 4;
  map<string, int64> mapStrInt = 5;
  map<int64, string> mapInt64Int = 6;

  repeated   int32 list = 7;
  repeated   PBTestMapValue v = 8;
  string string = 9;
}


